<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Course Registration System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container pb-5">
    <h1 class="mb-4">Admin Dashboard</h1>

    <div id="adminStats" class="row g-3 mb-4"></div>

    <ul class="nav nav-tabs mb-3" id="adminTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="enrollments-tab" data-bs-toggle="tab"
                data-bs-target="#enrollments-pane" type="button" role="tab"
                aria-controls="enrollments-pane" aria-selected="true">Enrollments</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="students-tab" data-bs-toggle="tab"
                data-bs-target="#students-pane" type="button" role="tab"
                aria-controls="students-pane" aria-selected="false">Students</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="courses-tab" data-bs-toggle="tab"
                data-bs-target="#courses-pane" type="button" role="tab"
                aria-controls="courses-pane" aria-selected="false">Courses</button>
      </li>
    </ul>

    <div class="tab-content">
      <div class="tab-pane fade show active" id="enrollments-pane" role="tabpanel" aria-labelledby="enrollments-tab">
        <div class="row g-2 mb-3">
          <div class="col-md-8">
            <input type="text" id="enrollmentSearch" class="form-control"
                   placeholder="Search by student, course code, or course name...">
          </div>
          <div class="col-md-4 d-flex gap-2">
            <button id="exportJsonBtn" class="btn btn-outline-primary w-100">Export JSON</button>
            <button id="exportCsvBtn" class="btn btn-outline-primary w-100">Export CSV</button>
          </div>
        </div>
        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead>
              <tr><th>Student</th><th>Course</th><th>Term</th><th>Instructor</th><th>Grade</th><th>Status</th></tr>
            </thead>
            <tbody id="enrollmentsBody"></tbody>
          </table>
        </div>
      </div>

      <div class="tab-pane fade" id="students-pane" role="tabpanel" aria-labelledby="students-tab">
        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead>
              <tr><th>ID</th><th>Name</th><th>Email</th><th>Credits</th><th>Average</th></tr>
            </thead>
            <tbody id="studentsBody"></tbody>
          </table>
        </div>
      </div>

      <div class="tab-pane fade" id="courses-pane" role="tabpanel" aria-labelledby="courses-tab">
        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead>
              <tr><th>Code</th><th>Course</th><th>Department</th><th>Credits</th><th>Sections</th><th>Seats free</th></tr>
            </thead>
            <tbody id="coursesBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
