<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - Course Registration System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="index.html">Course Registration</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="student-registration.html">Register</a></li>
        <li class="nav-item"><a class="nav-link" href="course-catalog.html">Catalog</a></li>
        <li class="nav-item"><a class="nav-link" href="enrollment-confirmation.html">Confirmation</a></li>
        <li class="nav-item"><a class="nav-link" href="admin-dashboard.html">Admin</a></li>
        <li class="nav-item"><a class="nav-link" href="student-profile.html">Profile</a></li>
      </ul>
    </div>
  </div>
</nav>
    <div class="container py-5">
        <h1 class="mb-4">Student Registration</h1>

        <form>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="firstName" class="form-label">First Name</label>
                    <input type="text" class="form-control" id="firstName" required>
                </div>
                <div class="col-md-6">
                    <label for="lastName" class="form-label">Last Name</label>
                    <input type="text" class="form-control" id="lastName" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" required>
            </div>

            <div class="mb-3">
                <label for="sectionSelect" class="form-label">Select Section</label>
                <select class="form-select" id="sectionSelect" required>
                    <option selected disabled value="">Choose a section...</option>
                    <option value="1">SEC-101 - Programming Concepts 1 (Mon/Wed 9:00 AM)</option>
                    <option value="2">SEC-102 - Database and Algorithms (Tue/Thu 1:00 PM)</option>
                    <option value="3">SEC-103 - Operating Systems (Mon/Wed 11:00 AM)</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary">Register</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
